id = "netfeez_aurora_lights"
name = "Aurora Lights"
version = "0.1.5"
description = "Dynamic glow for held and dropped light sources, optional colors, and a faint violet halo for enchanted gear."
authors = ["NetFeez"]
license = "Apache-2.0"
homepage = "https://github.com/netfeez/aura-lights-mod"
issues = "https://github.com/netfeez/aura-lights-mod/issues"
credits = "Companion shader repo: https://github.com/netfeez/aura-bloom-shader"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "world_snapshot"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_visuals"
kind = "HEAD"
helper = "src/mixins/world_snapshot.rs"
bindings = [{ name = "game", ty = "&Game<'_>", value = "&*self" }]
